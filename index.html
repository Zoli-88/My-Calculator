<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font awesome -->
    <script src="https://kit.fontawesome.com/d6e35dc92d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="main.css">
    <title>My Calculator</title>
</head>
<body>
    <section class="container">
        <div class="mobile-phone">
            <div class="front-camera gray-300-bg"></div>
            <div class="calculator">
                <div class="calculation text-align-right">123 x 2</div>
                <div class="result text-align-right">246</div>
                <div class="button-row">
                    <button class="gray-200-bg gray-100-border"><i class="fa-solid fa-delete-left"></i></button>
                    <button class="gray-200-bg gray-100-border">AC</button>
                    <button class="gray-200-bg gray-100-border">%</button>
                    <button class="orange-bg white-faded-border"><i class="fa-solid fa-divide"></i></button>
                </div>
                <div class="button-row">
                    <button class="gray-300-bg gray-200-border">7</button>
                    <button class="gray-300-bg gray-200-border">8</button>
                    <button class="gray-300-bg gray-200-border">9</button>
                    <button class="orange-bg white-faded-border">*</button>
                </div>
                <div class="button-row">
                    <button class="gray-300-bg gray-200-border">4</button>
                    <button class="gray-300-bg gray-200-border">5</button>
                    <button class="gray-300-bg gray-200-border">6</button>
                    <button class="orange-bg white-faded-border">-</button>
                </div>
                <div class="button-row">
                    <button class="gray-300-bg gray-200-border">1</button>
                    <button class="gray-300-bg gray-200-border">2</button>
                    <button class="gray-300-bg gray-200-border">3</button>
                    <button class="orange-bg white-faded-border">+</button>
                </div>
                <div class="button-row">
                    <button class="gray-300-bg gray-200-border"><i class="fa-solid fa-plus-minus"></i></button>
                    <button class="gray-300-bg gray-200-border">0</button>
                    <button class="gray-300-bg gray-200-border">.</button>
                    <button class="orange-bg white-faded-border">=</button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
