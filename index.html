<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Font awesome -->
        <script src="https://kit.fontawesome.com/d6e35dc92d.js" crossorigin="anonymous"></script>
    <!-- CSS -->
        <link rel="stylesheet" href="main.css">
        <!-- JS -->
        <script src="main.js" defer></script>
        <title>My Calculator</title>
    </head>
    <body>
        <section class="container">
            <div class="mobile-phone">
                <div class="front-camera gray-300-bg"></div>
                <div class="calculator">
                    <div class="calculation text-align-right" data-calculation>0</div>
                    <div class="result text-align-right" data-result>0</div>
                    <div class="button-row">
                        <button class="gray-200-bg gray-100-border" data-delete><i class="fa-solid fa-delete-left"></i></button>
                        <button class="gray-200-bg gray-100-border" data-clear>AC</button>
                        <button class="gray-200-bg gray-100-border" data-percent>%</button>
                        <button class="orange-bg white-faded-border" data-operator>/</button>
                    </div>
                    <div class="button-row">
                        <button class="gray-300-bg gray-200-border" data-num>7</button>
                        <button class="gray-300-bg gray-200-border" data-num>8</button>
                        <button class="gray-300-bg gray-200-border" data-num>9</button>
                        <button class="orange-bg white-faded-border" data-operator>*</button>
                    </div>
                    <div class="button-row">
                        <button class="gray-300-bg gray-200-border" data-num>4</button>
                        <button class="gray-300-bg gray-200-border" data-num>5</button>
                        <button class="gray-300-bg gray-200-border" data-num>6</button>
                        <button class="orange-bg white-faded-border" data-operator>-</button>
                    </div>
                    <div class="button-row">
                        <button class="gray-300-bg gray-200-border" data-num>1</button>
                        <button class="gray-300-bg gray-200-border" data-num>2</button>
                        <button class="gray-300-bg gray-200-border" data-num>3</button>
                        <button class="orange-bg white-faded-border" data-operator>+</button>
                    </div>
                    <div class="button-row">
                        <button class="gray-300-bg gray-200-border" data-sign><i class="fa-solid fa-plus-minus"></i></button>
                        <button class="gray-300-bg gray-200-border" data-num>0</button>
                        <button class="gray-300-bg gray-200-border" data-num>.</button>
                        <button class="orange-bg white-faded-border" data-equals>=</button>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
